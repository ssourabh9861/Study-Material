site_name: Study Material
site_url: https://ssourabh9861.github.io/Study-Material/
repo_url: https://github.com/ssourabh9861/Study-Material
repo_name: ssourabh9861/Study-Material

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - navigation.tracking

extra_css:
  - assets/stylesheets/custom.css

extra_javascript:
  - path: assets/javascripts/custom.js
    defer: true

exclude_docs: |
  PROMPT.md
  _*.md
  README.md
  *.java
  site/**
  dsa/data/parts/**
  dsa/data/lc-parts/**
  dsa/data/*.py
  dsa/data/tracker.csv

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

